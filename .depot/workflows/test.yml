name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs for the same branch/PR. Without this, stale runs
# can sit queued/running indefinitely (one run previously sat for 25 hours).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default. Jobs that need more must ask for it explicitly.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Skip husky's prepare-time hook install in CI (no commits happen here).
  HUSKY: 0

# Third-party actions are pinned to full commit SHAs, with the human-readable
# version in a trailing comment. A floating tag (`@v4`) is a mutable pointer:
# whoever controls the action repo can retag it at any time, and that code then
# runs inside jobs that hold secrets.
#
# DEPENDABOT DOES NOT SEE THIS FILE. Its github-actions ecosystem only scans
# .github/workflows/ (plus a root action.yml) and cannot be pointed elsewhere,
# so nothing bumps these pins automatically. The claim that Dependabot keeps
# them current was carried over from the .github copy and was false here.
# `pnpm check:action-pins` (in the lint job) fails when an action used in both
# trees drifts, so a Dependabot bump to .github cannot land without this file
# following. Actions used ONLY here have no upstream at all and need a periodic
# manual look; the script lists them on every run.

jobs:
  test:
    runs-on: depot-ubuntu-24.04-4
    strategy:
      matrix:
        node-version: [20, 22]

    # Redis for @celsian/queue-redis. Its 9 integration tests self-skip when
    # REDIS_URL is unset, so without this service they were permanently skipped
    # and the package had no real coverage at all.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Bundle size budget (size-limit)
        # Budgets live in .size-limit.mjs (~20% above measured). Run once.
        if: matrix.node-version == 22
        run: pnpm size

      - run: pnpm test -- --coverage --coverage.reporter=text --coverage.reporter=json-summary
        env:
          REDIS_URL: redis://127.0.0.1:6379

      - name: Check coverage threshold
        if: matrix.node-version == 22
        # Thresholds sit just under the measured values so a real regression
        # trips the gate while ordinary churn does not flap it. Measured on
        # 2026-07-26 against `packages/*/src` (see the `coverage` block in
        # vitest.config.ts): lines 80.24%, branches 87.95%, functions 92.26%.
        #
        # The old gate was lines >= 55 against an UNSCOPED denominator that
        # swept in examples/ and benchmarks/, so it could not have caught
        # anything. Scoping the denominator is what makes these numbers mean
        # something.
        run: |
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const summary = JSON.parse(readFileSync('./coverage/coverage-summary.json', 'utf8'));
            const total = summary.total;
            const gates = { lines: 78, branches: 85, functions: 90 };
            let failed = false;
            for (const [key, min] of Object.entries(gates)) {
              const pct = total[key].pct;
              const ok = pct >= min;
              console.log((ok ? 'ok  ' : 'FAIL') + '  ' + key + '=' + pct + '% (min ' + min + '%)');
              if (!ok) failed = true;
            }
            if (failed) {
              console.error('Coverage below threshold.');
              process.exit(1);
            }
          "

      - name: Typecheck
        # `pnpm typecheck` used to be `tsc --noEmit` against the root
        # tsconfig.json, which is `files: []` plus project references. Project
        # references are only traversed in build mode, so the program was EMPTY
        # and the gate passed in 0.26s no matter what. It now runs a real flat
        # program over packages/*/src and packages/*/test. See
        # tsconfig.typecheck.json.
        run: pnpm typecheck

  lint:
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify release surface
        run: pnpm assert:release-private

      - name: Verify action pins have not drifted
        # Dependabot cannot see .depot/workflows/, so this is the only thing
        # keeping its pinned action SHAs from silently falling behind the
        # .github copy that Dependabot does update.
        run: pnpm check:action-pins

      - name: Lint report (warnings included, informational)
        # The blocking step below filters to errors, which hid ~183 warnings
        # from anyone reading CI. This step exists purely so they are visible.
        # It does not gate; promoting warnings to blocking is a separate
        # decision that should come with a cleanup pass, not a silent flip.
        continue-on-error: true
        run: npx biome check .

      - name: Lint (blocking, errors only)
        run: npx biome check . --diagnostic-level=error

  security-audit:
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Dev-dependency audit (informational)
        # Transitive DEV-dep advisories (e.g. rollup via vitest) are not runtime
        # risks for anyone installing these packages, and they frequently block
        # CI for no gain. Logged, not gated.
        continue-on-error: true
        run: pnpm audit --audit-level=critical

      - name: Production dependency audit (blocking)
        # What actually ships to users. This one gates: a high-severity
        # advisory in a runtime dependency should stop the pipeline.
        # Previously the ONLY audit step was `|| true`, AND this job was
        # missing from ci-passed's `needs`, so it was non-blocking twice over.
        run: pnpm audit --prod --audit-level=high

  # Boot every example and hit its health endpoint. Nothing covered examples/
  # before this job, which is how the flagship showcase example shipped with a
  # cron expression that made it throw on startup.
  examples:
    runs-on: depot-ubuntu-24.04-4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Boot every example and probe it
        run: node .github/scripts/smoke-examples.mjs

  # Bun smoke test: boots the built @celsian/adapter-bun in the real Bun
  # runtime and asserts it serves a Request->Response. Mirrors test-deno.
  test-bun:
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Smoke-test the Bun adapter under Bun
        # Real runtime check, and BLOCKING, matching test-deno and test-workerd.
        #
        # This used to run `bun test` over the whole vitest suite. That tested
        # Bun's vitest-compatibility layer, not the adapter: it reported
        # failures for APIs Bun's runner does not implement (vi.setSystemTime)
        # and hung on tests holding a real server open. To stay green it had to
        # be advisory and self-bounded by a timeout, so it gated nothing while
        # still burning its whole budget on every run. A job that cannot fail
        # is not a test.
        #
        # bun-smoke.ts instead loads the built core + adapter, serves a GET and
        # a POST (the POST crosses the body/stream boundary, where a runtime
        # difference would actually show up) and checks createBunServeOptions
        # still returns what users pass to Bun.serve. Runs in well under a
        # second and exits non-zero on failure. Needs `pnpm build` first.
        run: bun run packages/adapter-bun/bun-smoke.ts

  # Deno smoke test: verifies the Deno adapter type-checks under Deno
  test-deno:
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      # NOTE: `denoland/setup-deno@v2` is a BRANCH, not a tag, so the previous
      # floating reference followed a moving head on every push. Pinned to the
      # branch head as of 2026-07-26.
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.x

      # Build so @celsian/core is compiled and resolvable via node_modules.
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Smoke-test the Deno adapter under Deno
        # Real runtime check (not a no-op): loads @celsian/core + the built adapter under
        # Deno, builds an app, and serves a Request->Response. Stronger than `deno check`
        # and avoids the Node-oriented d.ts type references. Needs `pnpm build` first.
        working-directory: packages/adapter-deno
        run: deno run -A deno-smoke.ts

  # workerd smoke test: boots the built @celsian/adapter-cloudflare in the
  # real workerd runtime via `wrangler dev` and asserts a 200 response.
  test-workerd:
    runs-on: depot-ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm

      # The smoke script runs wrangler via `npx --yes wrangler@4`; cache the
      # npm/npx download so repeat runs don't re-fetch workerd (~60 MB).
      - name: Cache npx wrangler
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm
          key: npx-wrangler-4-${{ runner.os }}

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Smoke-test the Cloudflare adapter on workerd
        # Boots scripts/workerd-smoke-worker.mjs (real built dist of core +
        # adapter-cloudflare) on workerd and asserts GET /health -> 200.
        run: node scripts/workerd-smoke.mjs

  # Final gate: all required checks must pass before this reports success.
  # Use this as the single required status check in branch protection.
  ci-passed:
    if: always()
    # test-bun is back in `needs` as of the bun-smoke rewrite. It was removed
    # while it ran the vitest suite under Bun's runner: advisory, unable to
    # fail, and slow enough to gate every merge on a job whose result was then
    # discarded. It is now a sub-second runtime smoke that exits non-zero on
    # failure, so it is a real gate like test-deno and test-workerd.
    needs: [test, lint, security-audit, examples, test-bun, test-deno, test-workerd]
    runs-on: depot-ubuntu-24.04
    steps:
      - name: Check all jobs passed
        run: |
          failed=0
          for job in test lint security-audit examples test-bun test-deno test-workerd; do
            # Every job in the list above MUST have a branch here. A missing one
            # does not error: $result simply keeps the previous iteration's
            # value, so the job is silently checked against someone else's
            # result. The `*)` catch-all below turns that into a loud failure.
            case "$job" in
              test)           result="${{ needs.test.result }}" ;;
              lint)           result="${{ needs.lint.result }}" ;;
              security-audit) result="${{ needs.security-audit.result }}" ;;
              examples)       result="${{ needs.examples.result }}" ;;
              test-bun)       result="${{ needs.test-bun.result }}" ;;
              test-deno)      result="${{ needs.test-deno.result }}" ;;
              test-workerd)   result="${{ needs.test-workerd.result }}" ;;
              *)              echo "BUG: no result mapping for job '$job'"; exit 1 ;;
            esac
            if [[ "$result" != "success" ]]; then
              echo "FAILED: $job ($result)"
              failed=1
            fi
          done
          if [[ "$failed" == "1" ]]; then
            exit 1
          fi
          echo "All required CI checks passed"
