name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Skip husky's prepare-time hook install in CI; the changesets action
  # creates commits and must not run the local pre-commit hook.
  HUSKY: 0

# SUPPLY CHAIN: every third-party action below is pinned to a full commit SHA
# with the human-readable version in a trailing comment. This job holds
# NPM_TOKEN and NODE_AUTH_TOKEN and carries `contents: write`, `id-token: write`
# and `pull-requests: write`. A floating tag (`@v4`) is a mutable pointer: the
# action's owner, or anyone who compromises that repo, can retag it and have
# their code run here with the publish token in scope. Dependabot's
# github-actions ecosystem keeps these SHAs current.

jobs:
  # Gate: run the full test suite before any release happens
  verify:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Run tests
        run: pnpm test
        env:
          REDIS_URL: redis://127.0.0.1:6379

      - name: Typecheck
        # Real gate as of 2026-07-26. This step previously ran
        # `tsc --noEmit` against a `files: []` root config, so it checked
        # nothing and passed unconditionally. See tsconfig.typecheck.json.
        run: pnpm typecheck

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Verify publish surface and packed packages
        run: pnpm verify:publish

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # PINNED TO THE v1 LINE ON PURPOSE. The action major is coupled to the
      # Changesets CLI major: v2 of this action refuses to run against CLI v2
      # ("designed to work with Changesets CLI v3"), and CLI v3 in turn requires
      # pnpm >= 10 while this repo is on pnpm 9.15. Moving to the v2 action is
      # therefore a three-part change (action + CLI + package manager), not a
      # SHA bump. `scripts/check-changesets-action-compat.mjs` enforces the
      # pairing so the next attempt fails in PR CI instead of here.
      #
      # `changesets/action@v1` is a BRANCH ref upstream, not a tag, so this pins
      # the commit that upstream tagged v1.9.0.
      #
      # Input names below are the v1 spelling. v2 renamed all three
      # (`publish` -> `publish-script`, `title` -> `pr-title`,
      # `commit` -> `commit-message`), and an unknown input is not an error in
      # Actions, so the names must move together with the major.
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        id: changesets
        with:
          publish: pnpm release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # REQUIRED for provenance. `changeset publish` has NO `--provenance`
          # flag: passing one now hard-errors ("Unknown flag for publish:
          # --provenance") and fails the whole release, so the `release` script
          # must NOT pass it. npm DOES honor the equivalent npm_config_*
          # environment variable, so provenance is enabled here instead.
          # Requires the `id-token: write` permission above; keep both together.
          NPM_CONFIG_PROVENANCE: true

      - name: Verify npm registry packages
        if: steps.changesets.outputs.published == 'true'
        run: pnpm verify:registry

      - name: Upload registry smoke artifact
        if: ${{ always() && steps.changesets.outputs.published == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: celsian-registry-smoke
          path: artifacts/registry-smoke.json
          if-no-files-found: error
