name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Skip husky's prepare-time hook install in CI; the changesets action
  # creates commits and must not run the local pre-commit hook.
  HUSKY: 0

# SUPPLY CHAIN: every third-party action below is pinned to a full commit SHA
# with the human-readable version in a trailing comment. This job holds
# NPM_TOKEN and NODE_AUTH_TOKEN and carries `contents: write`, `id-token: write`
# and `pull-requests: write`. A floating tag (`@v4`) is a mutable pointer: the
# action's owner, or anyone who compromises that repo, can retag it and have
# their code run here with the publish token in scope. Dependabot's
# github-actions ecosystem keeps these SHAs current.

jobs:
  # Gate: run the full test suite before any release happens
  verify:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Run tests
        run: pnpm test
        env:
          REDIS_URL: redis://127.0.0.1:6379

      - name: Typecheck
        # Real gate as of 2026-07-26. This step previously ran
        # `tsc --noEmit` against a `files: []` root config, so it checked
        # nothing and passed unconditionally. See tsconfig.typecheck.json.
        run: pnpm typecheck

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Verify publish surface and packed packages
        run: pnpm verify:publish

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # v2 renamed every input this step passes: `publish` -> `publish-script`,
      # `title` -> `pr-title`, `commit` -> `commit-message`. An unknown input is
      # not an error in Actions, so bumping the SHA without renaming them would
      # have left the action on its defaults: no publish script at all, and a
      # version PR titled "Version Packages". The release would look like it ran
      # and nothing would reach npm. The `published` output is unchanged.
      #
      # v1 was a BRANCH ref upstream that moved on every push; v2.1.1 is a real
      # release tag, pinned here to its commit.
      - uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        id: changesets
        with:
          publish-script: pnpm release
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # REQUIRED for provenance. `changeset publish` has NO `--provenance`
          # flag: passing one now hard-errors ("Unknown flag for publish:
          # --provenance") and fails the whole release, so the `release` script
          # must NOT pass it. npm DOES honor the equivalent npm_config_*
          # environment variable, so provenance is enabled here instead.
          # Requires the `id-token: write` permission above; keep both together.
          NPM_CONFIG_PROVENANCE: true

      - name: Verify npm registry packages
        if: steps.changesets.outputs.published == 'true'
        run: pnpm verify:registry

      - name: Upload registry smoke artifact
        if: ${{ always() && steps.changesets.outputs.published == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: celsian-registry-smoke
          path: artifacts/registry-smoke.json
          if-no-files-found: error
